version: '3'

vars:
  COMPOSE: docker compose --project-directory . --file deploy/local/compose.yaml
  NETWORK_COMPOSE: docker compose --project-directory . --file deploy/local/compose.yaml --file deploy/local/network.compose.yaml
  DOMAINS_COMPOSE: docker compose --project-directory . --file deploy/local/compose.yaml --file deploy/local/network.compose.yaml --file deploy/local/domains.compose.yaml
  SERVICES_COMPOSE: docker compose --project-directory . --file deploy/local/compose.yaml --file deploy/local/services.compose.yaml

tasks:
  migrations:build:
    desc: Build pinned Goose, Squawk and pgschema review tooling
    run: once
    cmds:
      - '{{.COMPOSE}} build migration-tools'

  db:lint:
    desc: Check historical migration hashes and strictly lint new Goose Up SQL
    deps: [migrations:build]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps migration-tools lint'

  db:schema:
    desc: Export a SCHEMA from clean Goose replay into ignored working/migrations/NAME
    deps: [migrations:build]
    env:
      REVIEW_SCHEMA: '{{.SCHEMA | default "commerce"}}'
      REVIEW_NAME: '{{.NAME | default "schema"}}'
    cmds:
      - '{{.COMPOSE}} up --detach --wait migration-db'
      - '{{.COMPOSE}} run --rm --no-deps -e REVIEW_SCHEMA -e REVIEW_NAME migration-tools export'

  db:draft:
    desc: Draft SQL from working/migrations/NAME/desired.sql against clean Goose history (SCHEMA, NAME)
    deps: [migrations:build]
    env:
      REVIEW_SCHEMA: '{{.SCHEMA | default "commerce"}}'
      REVIEW_NAME: '{{.NAME | default "schema"}}'
    cmds:
      - '{{.COMPOSE}} up --detach --wait migration-db'
      - '{{.COMPOSE}} run --rm --no-deps -e REVIEW_SCHEMA -e REVIEW_NAME migration-tools draft'

  test:migrations:
    desc: Test lint gates and actual Goose/pgschema round trips on isolated PostgreSQL
    deps: [migrations:build]
    cmds:
      - defer: '{{.COMPOSE}} stop migration-db'
      - '{{.COMPOSE}} up --detach --wait migration-db'
      - '{{.COMPOSE}} run --rm --no-deps --entrypoint python migration-tools -m unittest discover -s scripts/migrations -p "test_*.py" -v'

  test:contracts:
    desc: Exercise selected REST contracts with Schemathesis against disposable PostgreSQL
    cmds:
      - task: generate:go
      - defer: '{{.COMPOSE}} stop browser-api test-db'
      - '{{.COMPOSE}} build browser-api'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go run ./cmd/ops/migrate'
      - '{{.COMPOSE}} up --force-recreate --detach --wait browser-api'
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/test/browser-fixture | {{.COMPOSE}} run --rm --no-deps -T contract-tests /workspace/contracts/testing/test_api.py'

  sql:generate:
    desc: Generate ignored Go queries from owned SQL and Goose migrations
    deps: [tools:build]
    sources: [services/platform/sqlc.yaml, services/platform/internal/**/persistence/queries/*.sql, services/platform/cmd/api/transport/ucpinternal/persistence/queries/*.sql, services/platform/internal/infra/database/migrations/*.sql]
    generates:
      - services/platform/internal/core/persistence/sqlgen/*.go
      - services/platform/internal/food/persistence/sqlgen/*.go
      - services/platform/internal/shopping/persistence/sqlgen/*.go
      - services/platform/internal/lodging/persistence/sqlgen/*.go
      - services/platform/cmd/api/transport/ucpinternal/persistence/sqlgen/*.go
      - services/platform/internal/payment/persistence/sqlgen/*.go
      - services/platform/internal/discovery/persistence/sqlgen/*.go
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools sqlc generate'

  sql:check:
    desc: Check SQL queries and deterministic generation without tracking outputs
    cmds:
      - task: sql:generate
      - '{{.COMPOSE}} run --rm --no-deps tools sqlc vet'
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/check-sql-generation.sh'

  lint:go:
    desc: Run focused pinned Go correctness linters
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps go-lint golangci-lint config verify --config /workspace/.golangci.yml'
      - '{{.COMPOSE}} run --rm --no-deps go-lint golangci-lint run --config /workspace/.golangci.yml ./...'

  dev:internal-credential:
    desc: Print a one-hour internal cohort credential (STORE, DOMAIN, optional MANAGEMENT=true and CUSTOMER=UUID)
    env:
      OCP_DEV_STORE: '{{.STORE | default ""}}'
      OCP_DEV_CUSTOMER: '{{.CUSTOMER | default ""}}'
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_DEV_STORE -e OCP_DEV_CUSTOMER -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/provision-internal -domain={{.DOMAIN | default "shopping"}} -management={{.MANAGEMENT | default "false"}}'
  domains:dev:
    desc: Start optional internal domain API and catalog worker roles from the same image
    cmds:
      - task: db:prepare
      - task: network:prepare
      - '{{.COMPOSE}} build api'
      - '{{.DOMAINS_COMPOSE}} up --detach --wait api internal-shopping internal-lodging catalog-worker'

  domains:stop:
    desc: Stop optional role processes, retaining all local data
    cmds:
      - '{{.DOMAINS_COMPOSE}} stop internal-shopping internal-lodging catalog-worker'
  test:domains:
    desc: Test separate domain API and worker processes, recovery, saturation, and pinned UCP schemas
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} up --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_TEST_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable -e OCP_TEST_API_BINARY=/tmp/ocp-api -e OCP_TEST_UCP_SOURCE=true tools sh -ec ''go build -o /tmp/ocp-api ./cmd/api; go test -race -count=1 ./tests/integration -run "TestInternal|TestDomainProcess|TestWorkerProcess|TestServiceProcess" -v'''

  test:work-observations:
    desc: Observe local worker idle cadence and a bounded burst against the old ticker cadence
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} up --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_TEST_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable -e OCP_TEST_WORK_OBSERVATIONS=true tools go test -race -count=1 -run TestWorkSchedulingObservations -v ./tests/integration'

  services:dev:
    desc: Start optional separate core and Food API processes on ports 18182 and 18183
    cmds:
      - task: db:prepare
      - '{{.COMPOSE}} build api'
      - '{{.SERVICES_COMPOSE}} up --detach --wait core-api food-api'

  services:stop:
    desc: Stop only the separate core and Food APIs, retaining local data
    cmds:
      - '{{.SERVICES_COMPOSE}} stop core-api food-api'
  network:prepare:
    desc: Build pinned native ONIX and provision isolated synthetic provider databases
    deps: [generate:go]
    cmds:
      - 'docker build --file services/onix/Dockerfile --tag ocp-platform-onix:local .'
      - '{{.COMPOSE}} run --rm --no-deps tools go build -o /workspace/working/native-onix/ocp-network-lab ./cmd/test/network-lab'
      - '{{.NETWORK_COMPOSE}} up --detach --wait network-db'
      - '{{.NETWORK_COMPOSE}} run --rm --no-deps tools /workspace/working/native-onix/ocp-network-lab -mode init'

  network:dev:
    desc: Start the native publisher/crawler and isolated two-provider acceptance harness
    cmds:
      - task: network:prepare
      - '{{.NETWORK_COMPOSE}} up --detach --force-recreate network-lab onix-provider-a onix-provider-b onix-crawler'

  test:network:
    desc: Exercise native ONIX publication, crawl, withdrawal, discovery, and authoritative quotes
    cmds:
      - task: network:dev
      - '{{.NETWORK_COMPOSE}} run --rm --no-deps -e OCP_TEST_NATIVE_NETWORK=true tools go test -race -count=1 ./tests/integration -run TestNativeONIXFoodJourney -v'

  network:stop:
    desc: Stop only the synthetic network services, preserving generated keys and local databases
    cmds:
      - '{{.NETWORK_COMPOSE}} stop network-lab onix-provider-a onix-provider-b onix-crawler network-db'

  generate:
    desc: Generate all ignored Go/TypeScript artifacts from source contracts
    cmds:
      - task: generate:go
      - task: web:generate

  generate:go:
    desc: Prepare generated Go API and embedded error catalog before compilation
    deps: [contracts:generate, contracts:internal:generate, errors:generate, sql:generate]

  generated:check:
    desc: Reject generated outputs accidentally added to Git tracking
    cmds:
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'tracked=$(git -c safe.directory=/workspace -C /workspace ls-files -- services/platform/cmd/api/transport/httpapi/generated.go services/platform/internal/core/ucp/contract/generated.go ":(glob)services/platform/**/sqlgen/**" services/platform/internal/core/problems/catalog.generated.json apps/web/src/lib/api/generated.d.ts apps/web/src/lib/i18n/errors.generated.ts); if [ -n "$tracked" ]; then printf "%s\n" "$tracked"; exit 1; fi'

  media:start:
    desc: Start optional local S3-compatible storage without changing application data
    cmds:
      - '{{.COMPOSE}} --profile media up --detach object-store'

  media:seed:
    desc: Seed and verify private synthetic food photos in local S3 storage
    cmds:
      - task: media:start
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/seed-demo-media.sh'

  media:check:
    desc: Verify local object storage and repeatable photo seeding twice
    cmds:
      - task: media:seed
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/seed-demo-media.sh'

  media:prepare:
    desc: Encode newly generated PNGs from ignored working/demo-media as demo JPEGs
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go run /workspace/scripts/prepare-demo-media.go'

  media:stop:
    desc: Stop optional local object storage while retaining its named volume
    cmds:
      - '{{.COMPOSE}} --profile media stop object-store'

  dev:seed-media:
    desc: Add photos, categories, translations and meal deals to matching demo items without overwriting edits
    cmds:
      - task: dev:seed
      - task: media:seed
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/dev/seed-demo-media'

  default:
    desc: List available local commands
    cmds:
      - task --list

  doctor:
    desc: Check Task, Docker, and the Compose definition
    cmds:
      - task --version
      - docker version --format '{{"{{.Server.Version}}"}}'
      - '{{.COMPOSE}} config --quiet'

  tools:build:
    desc: Build the containerized Go toolchain
    run: once
    cmds:
      - '{{.COMPOSE}} build tools'

  fmt:
    desc: Format Go sources inside Docker
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go fmt ./...'

  fmt:check:
    desc: Fail when Go sources need formatting without editing them
    deps: [generate:go]
    cmds:
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'unformatted=$(gofmt -l cmd internal tests); if [ -n "$unformatted" ]; then printf "%s\n" "$unformatted"; exit 1; fi'

  test:
    desc: Run Go unit tests inside Docker
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go test -count=1 ./...'

  test:race:
    desc: Run tests with the Go race detector inside Docker
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go test -race -count=1 ./...'

  test:telemetry:
    desc: Check safe OTel signals, streaming, and local OTLP/HTTP export without Grafana
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go test -race -count=1 ./internal/infra/telemetry ./internal/food/adapters/mcp ./cmd/api/transport/httpapi ./cmd/api'

  test:mutation:web:
    desc: Run Stryker on basket, checkout and session TypeScript rules and write local reports
    cmds:
      - task: web:generate
      - '{{.COMPOSE}} build web-mutation'
      - '{{.COMPOSE}} run --rm --no-deps web-mutation pnpm run test:mutation'

  test:mutation:go:
    desc: Run pinned Gremlins on Food and development-payment rules in an isolated source copy
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/mutation-go.sh'

  test:mutation:work:
    desc: Mutate worker scheduling and attempt rules in an isolated source copy
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/mutation-work.sh'

  test:mutation:mcp:
    desc: Mutate merchant price/meal edits, meal reads, and retained diffs in an isolated source copy
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/mutation-mcp.sh'

  vet:
    desc: Run Go static checks inside Docker
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go vet ./...'

  build:
    desc: Build the non-root API runtime image
    cmds:
      - '{{.COMPOSE}} build api'

  web:install:
    desc: Install the locked web cohort inside Docker, never on the host
    cmds:
      - '{{.COMPOSE}} build web-tools'
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm install --store-dir /root/.local/share/pnpm/store --frozen-lockfile --ignore-scripts'

  web:add:
    desc: Add an exact web dependency inside Docker (task web:add PACKAGE=name)
    requires:
      vars: [PACKAGE]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm add --store-dir /root/.local/share/pnpm/store --save-exact --ignore-scripts {{.PACKAGE}}'

  web:generate:
    desc: Generate ignored TypeScript API types and error catalogs from owned contracts
    sources:
      - contracts/build/provider.openapi.json
      - apps/web/package.json
      - apps/web/pnpm-lock.yaml
    generates: [apps/web/src/lib/api/generated.d.ts]
    deps: [contracts:bundle, errors:generate, web:install]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm run contracts:generate'

  web:check:
    desc: Generate API types, check components, run tests, and build the web runtime
    cmds:
      - task: web:generate
      - '{{.COMPOSE}} run --rm --no-deps web-tools sh -ec "pnpm run contracts:check && pnpm run check && pnpm test"'
      - '{{.COMPOSE}} build web'

  web:dev:
    desc: Run local Svelte hot reload on localhost:18181 with API/database in Docker
    cmds:
      - task: dev
      - '{{.COMPOSE}} stop web'
      - task: web:local

  web:local:
    desc: Run local Svelte hot reload against the already running local API
    dir: apps/web
    deps: [web:generate]
    env:
      OCP_API_URL: http://127.0.0.1:18180
      OCP_LOCAL_INSECURE_COOKIES: 'true'
      OCP_DEVELOPMENT_PAYMENTS: 'true'
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts
      - pnpm run dev

  web:container:
    desc: Run the built web app in Docker on localhost:18181 without hot reload
    cmds:
      - task: dev
      - '{{.COMPOSE}} up --build --detach --wait web'

  test:browser:
    desc: Exercise merchant, guest and provider-admin journeys with disposable PostgreSQL
    cmds:
      - task: generate:go
      - defer: '{{.COMPOSE}} stop browser-api browser-web test-db'
      - task: media:seed
      - '{{.COMPOSE}} build tools browser-api browser-web browser'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go run ./cmd/ops/migrate'
      - '{{.COMPOSE}} up --force-recreate --detach --wait browser-api browser-web'
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/test/browser-fixture | {{.COMPOSE}} run --rm --no-deps -T browser node scripts/run-browser-tests.mjs'

  test:browser:dev:
    desc: Run browser regressions against Vite development compilation with disposable PostgreSQL
    cmds:
      - task: generate
      - task: generated:check
      - task: media:seed
      - '{{.COMPOSE}} build tools browser-api browser'
      - defer: '{{.COMPOSE}} stop browser-api browser-web-dev test-db'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go run ./cmd/ops/migrate'
      - '{{.COMPOSE}} up --force-recreate --detach --wait browser-api browser-web-dev'
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/test/browser-fixture | {{.COMPOSE}} run --rm --no-deps -T -e OCP_BROWSER_URL=http://browser-web-dev:3000 browser node scripts/run-browser-tests.mjs'

  check:
    desc: Run formatting checks, vet, race tests, and the runtime build locally
    cmds:
      - task: tools:build
      - '{{.COMPOSE}} build web-tools'
      - task: generate
      - task: generated:check
      - task: errors:check
      - task: fmt:check
      - task: contracts:check
      - task: contracts:lint
      - task: sql:check
      - task: db:lint
      - task: test:migrations
      - task: lint:go
      - task: vet
      - task: test:race
      - task: test:integration
      - task: build
      - task: web:check

  dev:
    desc: Build and start the local API and PostgreSQL; wait for health checks
    cmds:
      # Do not let an old API write orders between a backfill and its new runtime.
      - '{{.COMPOSE}} stop api'
      - task: db:prepare
      - '{{.COMPOSE}} up --build --detach --wait api db'

  contracts:bundle:
    desc: Validate modular local OpenAPI sources and build a self-contained bundle
    deps: [tools:build]
    sources:
      - contracts/openapi/v1/**/*
      - services/platform/cmd/build/contracts/*.go
      - services/platform/go.mod
      - services/platform/go.sum
    generates: [contracts/build/provider.openapi.json]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/build/contracts'

  contracts:install:
    desc: Install pinned API lint tooling in Docker, independently of the UI
    cmds:
      - '{{.COMPOSE}} build contracts-tools'
      - '{{.COMPOSE}} run --rm --no-deps contracts-tools pnpm install --frozen-lockfile --ignore-scripts --store-dir /root/.local/share/pnpm/store'

  contracts:lint:
    desc: Lint modular OpenAPI contracts and test the API style rules
    cmds:
      - task: contracts:install
      - '{{.COMPOSE}} run --rm --no-deps contracts-tools pnpm test'
      - '{{.COMPOSE}} run --rm --no-deps contracts-tools pnpm run lint'
      - '{{.COMPOSE}} run --rm --no-deps contracts-tools pnpm exec spectral lint ../openapi/internal/openapi.yaml --ruleset ../openapi/internal/.spectral.yaml --fail-severity warn'

  errors:generate:
    desc: Generate Go and TypeScript error catalogs from module-owned contract files
    sources: [contracts/errors/*.json, scripts/generate-errors.mjs]
    generates:
      - services/platform/internal/core/problems/catalog.generated.json
      - apps/web/src/lib/i18n/errors.generated.ts
    cmds:
      - '{{.COMPOSE}} build web-tools'
      - '{{.COMPOSE}} run --rm --no-deps web-tools node ../../scripts/generate-errors.mjs'

  errors:check:
    desc: Verify that generated error catalogs match their module-owned sources
    deps: [errors:generate]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools node ../../scripts/generate-errors.mjs --check'

  contracts:generate:
    desc: Generate ignored Go models, client, routing, and embedded contract
    deps: [contracts:bundle]
    sources:
      - contracts/build/provider.openapi.json
      - contracts/tooling/go.yaml
      - services/platform/go.mod
      - services/platform/go.sum
    generates: [services/platform/cmd/api/transport/httpapi/generated.go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go tool oapi-codegen --config ../../contracts/tooling/go.yaml ../../contracts/build/provider.openapi.json'

  contracts:check:
    desc: Validate contracts and verify deterministic Go generation
    cmds:
      - task: contracts:generate
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'sed "s@^output:.*@output: /tmp/generated.go@" ../../contracts/tooling/go.yaml > /tmp/codegen.yaml; go tool oapi-codegen --config /tmp/codegen.yaml ../../contracts/build/provider.openapi.json; cmp cmd/api/transport/httpapi/generated.go /tmp/generated.go'
      - task: contracts:internal:generate
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'sed "s@^output:.*@output: /tmp/internal-generated.go@" ../../contracts/tooling/internal-go.yaml > /tmp/internal-codegen.yaml; go tool oapi-codegen --config /tmp/internal-codegen.yaml ../../contracts/build/internal.openapi.json; cmp internal/core/ucp/contract/generated.go /tmp/internal-generated.go'

  contracts:internal:bundle:
    desc: Validate and bundle the isolated internal UCP cohort contract
    deps: [tools:build]
    sources: [contracts/openapi/internal/**/*, services/platform/cmd/build/contracts/*.go]
    generates: [contracts/build/internal.openapi.json]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/build/contracts -source ../../contracts/openapi/internal/openapi.yaml -output ../../contracts/build/internal.openapi.json'

  contracts:internal:generate:
    desc: Generate ignored internal UCP cohort models and client
    deps: [contracts:internal:bundle]
    sources: [contracts/build/internal.openapi.json, contracts/tooling/internal-go.yaml, services/platform/go.mod, services/platform/go.sum]
    generates: [services/platform/internal/core/ucp/contract/generated.go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go tool oapi-codegen --config ../../contracts/tooling/internal-go.yaml ../../contracts/build/internal.openapi.json'

  db:prepare:
    desc: Start the development database, provision its restricted role, and apply migrations explicitly
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} up --detach --wait db'
      - '{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -f /dev/stdin < deploy/local/init/roles.sql'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/ops/migrate'

  dev:credential:
    desc: Print a local merchant credential (STORE=store-N or MERCHANT=UUID selects an existing merchant)
    env:
      OCP_DEV_MERCHANT: '{{.MERCHANT | default ""}}'
      OCP_DEV_STORE: '{{.STORE | default ""}}'
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_DEV_MERCHANT -e OCP_DEV_STORE -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/provision'

  dev:stores:
    desc: List local stores with handles and owning merchants (no credentials)
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/provision -list'

  dev:mcp-credential:
    desc: Print a one-hour merchant MCP credential for STORE=store-N or MERCHANT=UUID (not a REST login)
    env:
      OCP_DEV_MERCHANT: '{{.MERCHANT | default ""}}'
      OCP_DEV_STORE: '{{.STORE | default ""}}'
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_DEV_MERCHANT -e OCP_DEV_STORE -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/provision -merchant-mcp'

  dev:customer-mcp-credential:
    desc: Print a separate one-hour Food checkout MCP credential for a visible STORE=store-N (local only)
    env:
      OCP_DEV_STORE: '{{.STORE | default ""}}'
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_DEV_STORE -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/customer-mcp'

  dev:account-credential:
    desc: Create a local account fixture or grant for ACCOUNT=UUID (KIND, TRANSPORT, NAME, MERCHANT)
    deps: [generate:go]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/account -kind="{{.KIND | default "customer"}}" -transport="{{.TRANSPORT | default "mcp"}}" -name="{{.NAME | default ""}}" -account="{{.ACCOUNT | default ""}}" -merchant="{{.MERCHANT | default ""}}"'

  mcp:inspect:
    desc: Check local merchant tool schemas using pinned Inspector (set OCP_MCP_TOKEN first)
    preconditions:
      - sh: 'test -n "$OCP_MCP_TOKEN"'
        msg: Set OCP_MCP_TOKEN to the token returned by task dev:mcp-credential STORE=store-N
    cmds:
      - 'pnpm --package=@modelcontextprotocol/inspector@2.12.0 dlx mcp-inspector --cli http://127.0.0.1:{{.OCP_HTTP_PORT | default "18180"}}/mcp/merchant --transport http --protocol-era modern --method tools/list --header "Authorization: Bearer $OCP_MCP_TOKEN" --format json --quiet --strict'

  dev:seed:
    desc: Add the fictional 48-product restaurant once without overwriting existing data
    cmds:
      - task: db:prepare
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/dev/seed-demo'

  dev:admin-credential:
    desc: Print one separate temporary provider administration credential for local use
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/dev/provision -provider'

  dev:order-access:
    desc: Explicitly extend existing local full-merchant/admin credentials with order access, retaining store data
    cmds:
      - '{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -f /dev/stdin < deploy/local/enable-order-scopes.sql'

  test:integration:
    desc: Run real PostgreSQL foundation tests in isolated disposable databases
    deps: [generate:go]
    cmds:
      - defer: '{{.COMPOSE}} stop test-db'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_TEST_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go test -race -count=1 ./tests/integration'

  db:check:
    desc: Execute a harmless SQL connectivity check against the local database
    cmds:
      - "{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -c 'SELECT 1 AS connection_ok;'"

  smoke:
    desc: Start the stack, check the running API, and execute the SQL check
    cmds:
      - task: dev
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_SMOKE_URL=http://api:8080 tools go run ./cmd/test/check-local'
      - task: db:check

  logs:
    desc: Follow API and database logs
    cmds:
      - '{{.COMPOSE}} logs --follow api db'

  stop:
    desc: Stop the local stack while retaining database and compiler-cache volumes
    cmds:
      - '{{.COMPOSE}} down'
