version: '3'

vars:
  COMPOSE: docker compose --project-directory . --file deploy/local/compose.yaml

tasks:
  default:
    desc: List available local commands
    cmds:
      - task --list

  doctor:
    desc: Check Task, Docker, and the Compose definition
    cmds:
      - task --version
      - docker version --format '{{"{{.Server.Version}}"}}'
      - '{{.COMPOSE}} config --quiet'

  tools:build:
    desc: Build the containerized Go toolchain
    cmds:
      - '{{.COMPOSE}} build tools'

  fmt:
    desc: Format Go sources inside Docker
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go fmt ./...'

  fmt:check:
    desc: Fail when Go sources need formatting without editing them
    cmds:
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'unformatted=$(gofmt -l cmd internal); if [ -n "$unformatted" ]; then printf "%s\n" "$unformatted"; exit 1; fi'

  test:
    desc: Run Go unit tests inside Docker
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go test -count=1 ./...'

  test:race:
    desc: Run tests with the Go race detector inside Docker
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go test -race -count=1 ./...'

  test:mutation:web:
    desc: Run Stryker on checkout/session TypeScript logic and write local reports
    cmds:
      - task: web:install
      - '{{.COMPOSE}} build web-mutation'
      - '{{.COMPOSE}} run --rm --no-deps web-mutation pnpm run test:mutation'

  test:mutation:go:
    desc: Run pinned Gremlins on Food and development-payment rules in an isolated source copy
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools sh /workspace/scripts/mutation-go.sh'

  vet:
    desc: Run Go static checks inside Docker
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go vet ./...'

  build:
    desc: Build the non-root API runtime image
    cmds:
      - '{{.COMPOSE}} build api'

  web:install:
    desc: Install the locked web cohort inside Docker, never on the host
    cmds:
      - '{{.COMPOSE}} build web-tools'
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm install --store-dir /root/.local/share/pnpm/store --frozen-lockfile --ignore-scripts'

  web:add:
    desc: Add an exact web dependency inside Docker (task web:add PACKAGE=name)
    requires:
      vars: [PACKAGE]
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm add --store-dir /root/.local/share/pnpm/store --save-exact --ignore-scripts {{.PACKAGE}}'

  web:generate:
    desc: Generate committed TypeScript API types from the same OpenAPI bundle as Go
    cmds:
      - task: contracts:bundle
      - task: web:install
      - '{{.COMPOSE}} run --rm --no-deps web-tools pnpm run contracts:generate'

  web:check:
    desc: Verify generated API drift, type/component checks, tests, and web runtime build
    cmds:
      - task: contracts:bundle
      - task: web:install
      - '{{.COMPOSE}} run --rm --no-deps web-tools sh -ec "pnpm run contracts:check && pnpm run check && pnpm test"'
      - '{{.COMPOSE}} build web'

  web:dev:
    desc: Run local Svelte hot reload on localhost:18181 with API/database in Docker
    cmds:
      - task: dev
      - '{{.COMPOSE}} stop web'
      - task: web:local

  web:local:
    desc: Run local Svelte hot reload against the already running local API
    dir: apps/web
    env:
      OCP_API_URL: http://127.0.0.1:18180
      OCP_LOCAL_INSECURE_COOKIES: 'true'
      OCP_DEVELOPMENT_PAYMENTS: 'true'
    cmds:
      - pnpm install --frozen-lockfile --ignore-scripts
      - pnpm run dev

  web:container:
    desc: Run the built web app in Docker on localhost:18181 without hot reload
    cmds:
      - task: dev
      - '{{.COMPOSE}} up --build --detach --wait web'

  test:browser:
    desc: Exercise merchant, guest and provider-admin journeys with disposable PostgreSQL
    cmds:
      - defer: '{{.COMPOSE}} stop browser-api browser-web test-db'
      - '{{.COMPOSE}} build tools browser-api browser-web browser'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go run ./cmd/migrate'
      - '{{.COMPOSE}} up --force-recreate --detach --wait browser-api browser-web'
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/browser-fixture | {{.COMPOSE}} run --rm --no-deps -T browser node scripts/run-browser-tests.mjs'

  test:browser:dev:
    desc: Run browser regressions against Vite development compilation with disposable PostgreSQL
    cmds:
      - task: web:install
      - '{{.COMPOSE}} build tools browser-api browser'
      - defer: '{{.COMPOSE}} stop browser-api browser-web-dev test-db'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go run ./cmd/migrate'
      - '{{.COMPOSE}} up --force-recreate --detach --wait browser-api browser-web-dev'
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/browser-fixture | {{.COMPOSE}} run --rm --no-deps -T -e OCP_BROWSER_URL=http://browser-web-dev:3000 browser node scripts/run-browser-tests.mjs'

  check:
    desc: Run formatting checks, vet, race tests, and the runtime build locally
    cmds:
      - task: tools:build
      - '{{.COMPOSE}} build web-tools'
      - task: errors:check
      - task: fmt:check
      - task: contracts:check
      - task: vet
      - task: test:race
      - task: test:integration
      - task: build
      - task: web:check

  dev:
    desc: Build and start the local API and PostgreSQL; wait for health checks
    cmds:
      # Do not let an old API write orders between a backfill and its new runtime.
      - '{{.COMPOSE}} stop api'
      - task: db:prepare
      - '{{.COMPOSE}} up --build --detach --wait api db'

  contracts:bundle:
    desc: Validate modular local OpenAPI sources and build a self-contained bundle
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/contracts'

  errors:generate:
    desc: Generate Go and TypeScript error catalogs from module-owned contract files
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools node ../../scripts/generate-errors.mjs'

  errors:check:
    desc: Verify that generated error catalogs match their module-owned sources
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps web-tools node ../../scripts/generate-errors.mjs --check'

  contracts:generate:
    desc: Regenerate committed Go models, client, routing, and embedded contract
    cmds:
      - task: contracts:bundle
      - '{{.COMPOSE}} run --rm --no-deps tools go tool oapi-codegen --config ../../contracts/tooling/go.yaml ../../contracts/build/provider.openapi.json'

  contracts:check:
    desc: Validate contracts and detect generated-code drift without rewriting committed code
    cmds:
      - task: contracts:bundle
      - >-
        {{.COMPOSE}} run --rm --no-deps tools sh -ec
        'sed "s@^output:.*@output: /tmp/generated.go@" ../../contracts/tooling/go.yaml > /tmp/codegen.yaml; go tool oapi-codegen --config /tmp/codegen.yaml ../../contracts/build/provider.openapi.json; cmp internal/httpapi/generated.go /tmp/generated.go'

  db:prepare:
    desc: Start the development database, provision its restricted role, and apply migrations explicitly
    cmds:
      - '{{.COMPOSE}} up --detach --wait db'
      - '{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -f /dev/stdin < deploy/local/init/roles.sql'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/migrate'

  dev:credential:
    desc: Print a local merchant credential (STORE=store-N or MERCHANT=UUID selects an existing merchant)
    env:
      OCP_DEV_MERCHANT: '{{.MERCHANT | default ""}}'
      OCP_DEV_STORE: '{{.STORE | default ""}}'
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_DEV_MERCHANT -e OCP_DEV_STORE -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/provision'

  dev:stores:
    desc: List local stores with handles and owning merchants (no credentials)
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/provision -list'

  dev:seed:
    desc: Add the fictional 48-product restaurant once without overwriting existing data
    cmds:
      - task: db:prepare
      - '{{.COMPOSE}} run --rm --no-deps tools go run ./cmd/seed-demo'

  dev:admin-credential:
    desc: Print one separate temporary provider administration credential for local use
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_MIGRATION_DATABASE_URL=postgres://ocp_dev:ocp_local_only@db:5432/ocp_dev?sslmode=disable tools go run ./cmd/provision -provider'

  dev:order-access:
    desc: Explicitly extend existing local full-merchant/admin credentials with order access, retaining store data
    cmds:
      - '{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -f /dev/stdin < deploy/local/enable-order-scopes.sql'

  test:integration:
    desc: Run real PostgreSQL foundation tests in isolated disposable databases
    cmds:
      - defer: '{{.COMPOSE}} stop test-db'
      - '{{.COMPOSE}} up --force-recreate --detach --wait test-db'
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_TEST_DATABASE_URL=postgres://ocp_test:ocp_test_local_only@test-db:5432/ocp_test?sslmode=disable tools go test -race -count=1 ./internal/integration'

  db:check:
    desc: Execute a harmless SQL connectivity check against the local database
    cmds:
      - "{{.COMPOSE}} exec -T db psql -v ON_ERROR_STOP=1 -U ocp_dev -d ocp_dev -c 'SELECT 1 AS connection_ok;'"

  smoke:
    desc: Start the stack, check the running API, and execute the SQL check
    cmds:
      - task: dev
      - '{{.COMPOSE}} run --rm --no-deps -e OCP_SMOKE_URL=http://api:8080 tools go run ./cmd/check-local'
      - task: db:check

  logs:
    desc: Follow API and database logs
    cmds:
      - '{{.COMPOSE}} logs --follow api db'

  stop:
    desc: Stop the local stack while retaining database and compiler-cache volumes
    cmds:
      - '{{.COMPOSE}} down'
