name: ocp-platform

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    environment:
      OCP_API_URL: http://api:8080
      ORIGIN: http://localhost:18181
      OCP_LOCAL_INSECURE_COOKIES: 'true'
      BODY_SIZE_LIMIT: 300K
    ports:
      - '127.0.0.1:18181:3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web-tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tools
    working_dir: /workspace/apps/web
    environment:
      CI: 'true'
      pnpm_config_store_dir: /root/.local/share/pnpm/store
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - web-svelte-kit:/workspace/apps/web/.svelte-kit
      - web-npm-cache:/root/.npm
      - web-pnpm-cache:/root/.local/share/pnpm/store
    command: [node, --version]

  browser-api:
    profiles: [browser]
    build:
      context: .
      dockerfile: services/provider/Dockerfile
      target: api
    environment:
      OCP_DATABASE_URL: postgres://ocp_app:ocp_app_local_only@test-db:5432/ocp_test?sslmode=disable
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /ocp-api, -healthcheck]
      interval: 2s
      timeout: 3s
      retries: 20

  browser-web:
    profiles: [browser]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    environment:
      OCP_API_URL: http://browser-api:8080
      ORIGIN: http://browser-web:3000
      OCP_LOCAL_INSECURE_COOKIES: 'true'
      BODY_SIZE_LIMIT: 300K
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  browser:
    profiles: [browser]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: browsers
    environment:
      OCP_BROWSER_URL: http://browser-web:3000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: services/provider/Dockerfile
      target: api
    environment:
      OCP_DATABASE_URL: postgres://ocp_app:ocp_app_local_only@db:5432/ocp_dev?sslmode=disable
    ports:
      - "127.0.0.1:${OCP_HTTP_PORT:-18180}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /ocp-api, -healthcheck]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  db:
    # PostgreSQL 18.6. Local-only credentials; no host database port is exposed.
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ocp_dev
      POSTGRES_PASSWORD: ocp_local_only
      POSTGRES_DB: ocp_dev
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ocp_dev -d ocp_dev"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: services/provider/Dockerfile
      target: tools
    working_dir: /workspace/services/provider
    environment:
      GOTOOLCHAIN: local
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-module-cache:/go/pkg/mod
    command: [go, version]

  test-db:
    profiles: [test]
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ocp_test
      POSTGRES_PASSWORD: ocp_test_local_only
      POSTGRES_DB: ocp_test
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./deploy/local/init/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ocp_test -d ocp_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  web-node-modules:
  web-svelte-kit:
  web-npm-cache:
  web-pnpm-cache:
  postgres-data:
  go-build-cache:
  go-module-cache:
