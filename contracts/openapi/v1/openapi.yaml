openapi: 3.0.3
info:
  title: OCP Platform API
  version: 0.1.0
  contact:
    name: OCP Lab
  description: >-
    Draft owned contract, not UCP or Beckn conformance.
    JSON bodies; responses are not cacheable in this slice. Merchant grants are bound
    to one merchant; provider administration has a separate credential audience.
    Anonymous operations explicitly declare security and public access. Optional additions may remain in v1;
    removed fields or changed meaning require a new major API contract.
    Each HTTP attempt receives a fresh X-Request-ID UUID response header.
    Problem.code is the v1 programmatic discriminator; type may be about:blank.
servers:
  - url: /
tags:
  - name: Customer commerce
    description: Public browsing and guest-scoped quotes, orders, and payment interaction.
  - name: Merchant account
    description: Merchant store setup and account-owned store listings.
  - name: Merchant commerce
    description: Offering administration, ordering settings, and merchant order operations.
  - name: Operations
    description: Process liveness and operational transport checks.
  - name: Provider administration
    description: Separately authorized provider-wide inspection and publication moderation.
security:
  - BearerAuth: []
