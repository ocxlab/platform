type: object
required: [type, title, status, code, detail, instance]
properties:
  type:
    type: string
    format: uri
  title:
    type: string
  status:
    type: integer
    minimum: 400
    maximum: 599
  code:
    type: string
    description: Stable machine-readable error code.
  detail:
    type: string
  current_revision:
    type: integer
    format: int64
    minimum: 0
    description: Current draft head on a revision conflict.
  current_generation:
    type: integer
    format: int64
    minimum: 0
    description: Current publication generation on a publication_conflict.
  current_order_revision:
    type: integer
    format: int64
    minimum: 1
    description: Current operational order revision on order_revision_conflict. Read the order before selecting a new action.
  instance:
    type: string
    format: uri
    description: Unique error occurrence, urn:uuid matching the X-Request-ID response header.
