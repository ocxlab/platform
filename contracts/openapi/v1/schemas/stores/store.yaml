StoreDisplayName:
  allOf:
    - $ref: ../common/text.yaml#/PlainText
  type: string
  minLength: 1
  maxLength: 160
CreateStoreRequest:
  type: object
  additionalProperties: false
  required: [display_name]
  properties:
    display_name:
      $ref: '#/StoreDisplayName'
Store:
  type: object
  additionalProperties: false
  required: [id, merchant_id, display_name, created_at]
  properties:
    handle:
      type: string
      pattern: '^store-[1-9][0-9]*$'
      description: Immutable, provider-local readable reference; never authorization. Optional for historical replay responses. Names and UUID routes remain independent.
    id:
      $ref: ../common/identifier.yaml
    merchant_id:
      $ref: ../common/identifier.yaml
    display_name:
      $ref: '#/StoreDisplayName'
    created_at:
      type: string
      format: date-time
