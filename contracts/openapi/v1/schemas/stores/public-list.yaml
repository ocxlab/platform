PublicStore:
  type: object
  additionalProperties: false
  required: [merchant_id, id, display_name]
  properties:
    handle:
      $ref: store.yaml#/Store/properties/handle
    merchant_id:
      $ref: ../common/identifier.yaml
    id:
      $ref: ../common/identifier.yaml
    display_name: { type: string, minLength: 1, maxLength: 160 }
PublicStorePage:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/PublicStore'
    next_after:
      type: string
      pattern: '^[0-9a-f]{64}:[0-9a-fA-F-]{36}:[0-9a-fA-F-]{36}$'
