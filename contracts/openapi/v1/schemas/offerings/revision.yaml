Model:
  type: object
  additionalProperties: false
  required: [id, version]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 120
    version:
      type: string
      minLength: 1
      maxLength: 40
WriteOfferingRequest:
  type: object
  additionalProperties: false
  required: [base_revision, model, document]
  properties:
    base_revision:
      type: integer
      format: int64
      minimum: 0
      description: Expected current draft head; zero creates the first revision.
    model:
      $ref: '#/Model'
    document:
      type: object
      additionalProperties: true
      description: >-
        Bounded JSON validated by the installed model registry. The initial model
        is ocp.food.menu version 1.0.0 (domains/food/menu/v1/schema.yaml).
        Unknown models return unsupported_model (422), never silent acceptance.
OfferingRevision:
  type: object
  additionalProperties: false
  required: [merchant_id, store_id, revision, model, document, created_at, state]
  properties:
    merchant_id:
      $ref: ../common/identifier.yaml
    store_id:
      $ref: ../common/identifier.yaml
    revision:
      type: integer
      format: int64
      minimum: 1
    model:
      $ref: '#/Model'
    document:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
    state:
      type: string
      enum: [draft]
      description: Not published, orderable, or evidence of payment readiness.
