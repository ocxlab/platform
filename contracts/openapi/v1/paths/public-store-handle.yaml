get:
  operationId: GetPublicStoreByHandle
  tags: [Customer commerce]
  summary: Resolve a visible store's provider-local handle
  security: []
  x-access: public
  parameters:
    - name: store_handle
      in: path
      required: true
      schema: { type: string, pattern: '^store-[1-9][0-9]{0,17}$' }
  responses:
    '200':
      description: Public metadata for a currently visible store only.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/stores/public-list.yaml#/PublicStore
    '400':
      $ref: ../components/responses/problem.yaml
    '404':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    default:
      $ref: ../components/responses/problem.yaml
