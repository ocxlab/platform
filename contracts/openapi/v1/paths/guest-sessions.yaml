x-commerce-boundary: model
parameters:
  - $ref: ../components/parameters/merchant-id.yaml
  - $ref: ../components/parameters/store-id.yaml
post:
  operationId: CreateGuestSession
  tags: [Customer commerce]
  summary: Start guest checkout without registering
  description: >-
    Create a seven-day, store-scoped guest credential for quotes, placement and reading only its own orders. No account, payment or order is created. Store must have a visible publication. Anonymous issuance is non-idempotent and bounded to 1000 unexpired grants per store; this is not internet abuse protection.
  security: []
  x-access: public
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/common/empty.yaml
  responses:
    '201':
      description: Successful operation.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/common/guest-session.yaml#/GuestSession
    '400':
      $ref: ../components/responses/problem.yaml
    '401':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '404':
      $ref: ../components/responses/problem.yaml
    '409':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '422':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    'default':
      $ref: ../components/responses/problem.yaml
    '429':
      $ref: ../components/responses/guest-capacity.yaml
