x-commerce-boundary: model
parameters:
  - $ref: ../components/parameters/merchant-id.yaml
  - $ref: ../components/parameters/store-id.yaml
get:
  operationId: GetPublicOffering
  tags: [Customer commerce]
  summary: Browse current public offering
  description: >-
    Anonymous, explicitly published projection only. Absent, withdrawn and suspended offerings all return 404. Reads are no-store in this slice; this is not a discovery index.
  security: []
  x-access: public
  responses:
    '200':
      description: Current representation.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/offerings/publication.yaml#/PublicOffering
    '400':
      $ref: ../components/responses/problem.yaml
    '404':
      $ref: ../components/responses/problem.yaml
    '429':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    'default':
      $ref: ../components/responses/problem.yaml
