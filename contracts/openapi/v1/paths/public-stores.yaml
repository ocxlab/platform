x-commerce-boundary: model
get:
  operationId: ListPublicStores
  tags: [Customer commerce]
  summary: Find this provider's published stores
  description: >-
    Anonymous local directory, not network-wide discovery. Returns only store IDs
    and display names with a visible published offering. Case-insensitive literal
    name search. Live pages use ascending merchant/store IDs; refresh to see additions.
  security: []
  x-access: public
  parameters:
    - name: q
      description: Literal case-insensitive store-name substring, trimmed before matching.
      in: query
      schema: { type: string, maxLength: 160 }
    - name: after
      in: query
      description: Opaque continuation value bound to the trimmed search query. A different query returns 400; omit after to begin a new search.
      schema: { type: string, pattern: '^[0-9a-f]{64}:[0-9a-fA-F-]{36}:[0-9a-fA-F-]{36}$' }
    - name: limit
      description: Maximum number of public store summaries in this page.
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    '200':
      description: Visible stores only, or an empty list.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/stores/public-list.yaml#/PublicStorePage
    '400':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    default:
      $ref: ../components/responses/problem.yaml
