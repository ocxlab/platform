x-commerce-boundary: model
parameters:
  - $ref: ../components/parameters/merchant-id.yaml
  - $ref: ../components/parameters/store-id.yaml
  - $ref: ../components/parameters/media-id.yaml
post:
  operationId: CompleteMediaUpload
  x-access: merchant
  x-required-scope: offering:write
  tags: [Merchant commerce]
  summary: Verify a direct upload and retain a safe image derivative
  description: >-
    Empty body. Verifies declared size, type, checksum, decoded dimensions and
    pixel budget, then stores a metadata-free JPEG fitting within 960 pixels.
    A successful raw PUT alone does not authorize attachment. Derivative writes
    are retry-safe; readiness and original replay response commit together.
    A valid completion must start within the one-day pending deadline.
  parameters:
    - $ref: ../components/parameters/idempotency-key.yaml
  responses:
    '201':
      description: Authorized result.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/media/upload.yaml#/Asset
    default:
      $ref: ../components/responses/problem.yaml
    '400':
      $ref: ../components/responses/problem.yaml
    '401':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '404':
      $ref: ../components/responses/problem.yaml
    '409':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '422':
      $ref: ../components/responses/problem.yaml
    '429':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
