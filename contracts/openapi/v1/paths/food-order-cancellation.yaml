parameters:
  - $ref: ../components/parameters/merchant-id.yaml
  - $ref: ../components/parameters/store-id.yaml
  - $ref: ../components/parameters/order-id.yaml
post:
  operationId: CancelGuestFoodOrder
  security:
    - GuestBearerAuth: []
  x-access: guest
  x-required-scope: order:cancel
  tags: [Customer commerce]
  summary: Cancel this guest's unpaid, unprepared pickup order
  description: >-
    Only the placing guest can cancel. Requires current revision, open resolution, payment not_started
    and fulfilment_progress not_started. Works before or after merchant acceptance. No payment or refund
    effect is implied. Cancellation closes the order; late acceptance cannot reopen it.
    State, history and replay result commit atomically. Matching retries return the original 201 body.
  parameters:
    - $ref: ../components/parameters/idempotency-key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../domains/food/order/v1/operations.yaml#/CancelFoodOrderRequest
  responses:
    '201':
      $ref: ../components/responses/food-order.yaml
    default:
      $ref: ../components/responses/problem.yaml
    '400':
      $ref: ../components/responses/problem.yaml
    '401':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '404':
      $ref: ../components/responses/problem.yaml
    '409':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
