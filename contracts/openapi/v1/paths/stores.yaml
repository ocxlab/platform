parameters:
  - $ref: ../components/parameters/merchant-id.yaml
get:
  operationId: ListStores
  x-access: merchant
  x-required-scope: store:read
  tags: [Merchant account]
  summary: List stores managed by the authorized merchant
  description: >-
    Includes unpublished stores. Results are ordered by immutable store ID, ascending,
    within the credential's merchant. Use next_after as the next request's after
    cursor; a missing cursor means the last page. Pages are live reads, not a snapshot
    across requests. Restart from the first page to include newly created stores
    whose IDs sort before the current cursor. A cursor is a position, not authority
    or a lookup of another merchant's store.
  parameters:
    - name: handle
      in: query
      description: Exact provider-local readable store handle. Still restricted to the authorized merchant.
      schema:
        type: string
        pattern: '^store-[1-9][0-9]{0,17}$'
    - $ref: ../components/parameters/page-limit.yaml
    - $ref: ../components/parameters/store-after.yaml
  responses:
    '200':
      description: A bounded page of managed stores; items is empty when no stores match.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/stores/list.yaml#/StorePage
    '400':
      $ref: ../components/responses/problem.yaml
    '401':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    default:
      $ref: ../components/responses/problem.yaml
post:
  operationId: CreateStore
  x-access: merchant
  x-required-scope: store:write
  tags: [Merchant account]
  summary: Create a store for the authorized merchant
  description: Requires store:write. Display names do not establish public identity or domains.
  parameters:
    - $ref: ../components/parameters/idempotency-key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/stores/store.yaml#/CreateStoreRequest
  responses:
    '201':
      description: Successful result; matching retries return this original status and body.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/stores/store.yaml#/Store
    default:
      $ref: ../components/responses/problem.yaml
    '400':
      $ref: ../components/responses/problem.yaml
    '401':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '409':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
