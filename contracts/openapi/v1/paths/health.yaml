x-commerce-boundary: shared
get:
  operationId: GetLiveness
  x-access: public
  tags: [Operations]
  security: []
  summary: Check process liveness, not commerce or database readiness
  description: Reports only that the HTTP process is alive; does not test dependencies or readiness to accept orders.
  responses:
    '200':
      description: Process is alive; no commerce readiness assertion.
      headers:
        X-Request-ID:
          $ref: ../components/headers/request-id.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/common/health.yaml
    default:
      $ref: ../components/responses/problem.yaml
