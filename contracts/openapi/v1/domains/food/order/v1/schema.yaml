PlaceFoodOrderRequest:
  type: object
  additionalProperties: false
  required: [quote_id, fulfilment]
  properties:
    quote_id:
      $ref: ../../../../schemas/common/identifier.yaml
    fulfilment:
      type: string
      enum: [pickup]
FoodOrder:
  type: object
  additionalProperties: false
  required: [id, merchant_id, store_id, contract, terms, fulfilment, acceptance, payment, fulfilment_progress, resolution, created_at]
  properties:
    reference:
      type: string
      pattern: '^O-[0-9]{6,19}$'
      description: Immutable, provider-local display reference. Never resets or grants access. Optional only for historical replay bodies.
    id:
      $ref: ../../../../schemas/common/identifier.yaml
    merchant_id:
      $ref: ../../../../schemas/common/identifier.yaml
    store_id:
      $ref: ../../../../schemas/common/identifier.yaml
    contract:
      type: string
      enum: [ocp.food.order.v1]
    terms:
      description: Immutable agreed quote snapshot. expires_at is the deadline for first placement, not an expiry or cancellation of this order.
      allOf:
        - $ref: ../../selection/v1/schema.yaml#/FoodQuote
    fulfilment:
      type: string
      enum: [pickup]
    acceptance:
      type: string
      enum: [pending, accepted, rejected]
    payment:
      type: string
      enum: [not_started, awaiting_customer, failed, paid, refunded]
    payment_provider:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z0-9][a-z0-9._:-]*$'
      description: Opaque provider identifier. Only development is currently emitted; its paid/refunded outcomes never represent real money. Other adapters remain unimplemented.
    fulfilment_progress:
      type: string
      enum: [not_started, preparing, ready, collected]
    resolution:
      type: string
      enum: [open, rejected, cancelled]
    revision:
      description: Current operational revision. Optional for compatibility with retained placement replay bodies; current reads always supply it.
      type: integer
      format: int64
      minimum: 1
    history:
      description: Ordered durable history on individual order reads. Omitted from bounded inbox pages and old placement replays. Contains no credentials or actor identifiers.
      type: array
      maxItems: 32
      items:
        $ref: operations.yaml#/FoodOrderEvent
    created_at:
      type: string
      format: date-time
