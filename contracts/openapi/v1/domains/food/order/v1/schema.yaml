PlaceFoodOrderRequest:
  type: object
  additionalProperties: false
  required: [quote_id, fulfilment]
  properties:
    quote_id:
      $ref: ../../../../schemas/common/identifier.yaml
    fulfilment:
      type: string
      enum: [pickup]
FoodOrder:
  type: object
  additionalProperties: false
  required: [id, merchant_id, store_id, contract, terms, fulfilment, acceptance, payment, fulfilment_progress, resolution, created_at]
  properties:
    id:
      $ref: ../../../../schemas/common/identifier.yaml
    merchant_id:
      $ref: ../../../../schemas/common/identifier.yaml
    store_id:
      $ref: ../../../../schemas/common/identifier.yaml
    contract:
      type: string
      enum: [ocp.food.order.v1]
    terms:
      description: Immutable agreed quote snapshot. expires_at is the deadline for first placement, not an expiry or cancellation of this order.
      allOf:
        - $ref: ../../selection/v1/schema.yaml#/FoodQuote
    fulfilment:
      type: string
      enum: [pickup]
    acceptance:
      type: string
      enum: [pending, accepted, rejected]
    payment:
      type: string
      enum: [not_started]
    fulfilment_progress:
      type: string
      enum: [not_started]
    resolution:
      type: string
      enum: [open, rejected, cancelled]
    revision:
      description: Current operational revision. Optional for compatibility with retained placement replay bodies; current reads always supply it.
      type: integer
      format: int64
      minimum: 1
    history:
      description: Ordered durable history on individual order reads. Omitted from bounded inbox pages and old placement replays. Contains no credentials or actor identifiers.
      type: array
      maxItems: 4
      items:
        $ref: operations.yaml#/FoodOrderEvent
    created_at:
      type: string
      format: date-time
