FoodOrderDecision:
  type: object
  additionalProperties: false
  required: [expected_revision, decision]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 1
    decision:
      type: string
      enum: [accept, reject]
CancelFoodOrderRequest:
  type: object
  additionalProperties: false
  required: [expected_revision]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 1
FoodOrderEvent:
  type: object
  additionalProperties: false
  required: [sequence, event, created_at]
  properties:
    sequence:
      type: integer
      format: int64
      minimum: 1
    event:
      type: string
      enum: [placed, accepted, rejected, cancelled, payment_started, payment_paid, payment_failed, payment_abandoned, cancelled_refunded]
    created_at:
      type: string
      format: date-time
FoodOrderPage:
  type: object
  additionalProperties: false
  required: [items]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: schema.yaml#/FoodOrder
    next_after:
      type: string
      maxLength: 128
      description: Opaque position for the next page in newest-first order, not an authorization credential.
