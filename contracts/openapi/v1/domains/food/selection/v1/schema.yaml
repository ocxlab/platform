FoodSelectionRequest:
  type: object
  additionalProperties: false
  required: [publication_generation, lines]
  properties:
    locale:
      type: string
      enum: [de, en, ar]
      description: Preferred language for retained labels; missing translations use the merchant's default name.
    note:
      $ref: '#/CustomerNote'
    publication_generation:
      type: integer
      format: int64
      minimum: 1
    lines:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: '#/SelectionLine'
SelectionLine:
  type: object
  additionalProperties: false
  required: [item_id, variant_id, quantity, options]
  properties:
    note:
      $ref: '#/CustomerNote'
    item_id:
      $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
    variant_id:
      $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
    quantity:
      type: integer
      minimum: 1
      maximum: 99
    options:
      type: array
      maxItems: 600
      items:
        $ref: '#/SelectedOption'
SelectedOption:
  type: object
  additionalProperties: false
  required: [group_id, option_id]
  properties:
    group_id:
      $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
    option_id:
      $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
FoodQuote:
  type: object
  additionalProperties: false
  required: [id, merchant_id, store_id, publication_generation, revision, model, currency, lines, total_minor, created_at, expires_at]
  properties:
    note:
      $ref: '#/CustomerNote'
    id:
      $ref: ../../../../schemas/common/identifier.yaml
    merchant_id:
      $ref: ../../../../schemas/common/identifier.yaml
    store_id:
      $ref: ../../../../schemas/common/identifier.yaml
    publication_generation:
      type: integer
      format: int64
      minimum: 1
    revision:
      type: integer
      format: int64
      minimum: 1
    model:
      $ref: ../../../../schemas/offerings/revision.yaml#/Model
    currency:
      type: string
      enum: [EUR]
    lines:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: '#/QuotedLine'
    total_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000000
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
CustomerNote:
  type: string
  maxLength: 500
  description: Optional plain-text customer request, not a guaranteed change to ingredients, allergens, price, or agreed options.
QuotedLine:
  type: object
  additionalProperties: false
  required: [selection, item_name, variant_name, unit_price_minor, total_minor]
  properties:
    selection:
      $ref: '#/SelectionLine'
    item_name:
      type: string
    variant_name:
      type: string
    selected_options:
      type: array
      maxItems: 600
      description: Retained choice labels for display, including zero-price options. Optional for older preview quotes.
      items:
        type: object
        additionalProperties: false
        required: [group_id, option_id, group_name, option_name]
        properties:
          group_id:
            $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
          option_id:
            $ref: ../../menu/v1/schema.yaml#/LocalIdentifier
          group_name:
            type: string
          option_name:
            type: string
    unit_price_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000000
    total_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000000
