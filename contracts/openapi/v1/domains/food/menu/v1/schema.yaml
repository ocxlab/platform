FoodMenu:
  type: object
  additionalProperties: false
  required: [currency, availability_mode, items]
  properties:
    currency:
      type: string
      enum: [EUR]
      description: Deliberately limited initial calculation currency, not a core restriction.
    availability_mode:
      type: string
      enum: [manual]
    categories:
      type: array
      maxItems: 50
      description: Ordered menu sections. Items without a category remain visible in a separate section.
      items:
        $ref: '#/Category'
    meal_deals:
      type: array
      maxItems: 50
      description: Optional upgrades combining one eligible main with one included item per main unit. Only the surcharge is added; the included item's regular price is not charged.
      items:
        $ref: meal-deal.yaml#/MealDeal
    items:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: '#/Item'
Item:
  type: object
  additionalProperties: false
  required: [id, name, available, variants, option_groups]
  properties:
    translations:
      $ref: '#/NameTranslations'
    category_id:
      $ref: '#/LocalIdentifier'
    image_id:
      type: string
      format: uuid
      description: Ready media owned by this store; never a storage URL. Optional draft-contract addition.
    id:
      $ref: '#/LocalIdentifier'
    name:
      allOf:
        - $ref: ../../../../schemas/common/text.yaml#/PlainText
      type: string
      minLength: 1
      maxLength: 160
    available:
      type: boolean
      description: Merchant-controlled availability; no quantity reservation.
    variants:
      type: array
      minItems: 1
      maxItems: 30
      items:
        $ref: '#/Variant'
    option_groups:
      type: array
      maxItems: 20
      items:
        $ref: '#/OptionGroup'
Category:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    translations:
      $ref: '#/NameTranslations'
    id:
      $ref: '#/LocalIdentifier'
    name:
      allOf:
        - $ref: ../../../../schemas/common/text.yaml#/PlainText
      type: string
      minLength: 1
      maxLength: 80
Variant:
  type: object
  additionalProperties: false
  required: [id, name, price_minor]
  properties:
    translations:
      $ref: '#/NameTranslations'
    id:
      $ref: '#/LocalIdentifier'
    name:
      allOf:
        - $ref: ../../../../schemas/common/text.yaml#/PlainText
      type: string
      minLength: 1
      maxLength: 80
    price_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
OptionGroup:
  type: object
  additionalProperties: false
  required: [id, name, min_selected, max_selected, options]
  properties:
    default_option_ids:
      type: array
      maxItems: 30
      uniqueItems: true
      description: Merchant-selected initial choices. When present and nonempty, must satisfy this group's limits and refer to its options. Customers may change them.
      items:
        $ref: '#/LocalIdentifier'
    translations:
      $ref: '#/NameTranslations'
    id:
      $ref: '#/LocalIdentifier'
    name:
      allOf:
        - $ref: ../../../../schemas/common/text.yaml#/PlainText
      type: string
      minLength: 1
      maxLength: 80
    min_selected:
      type: integer
      minimum: 0
      maximum: 30
    max_selected:
      type: integer
      minimum: 1
      maximum: 30
    options:
      type: array
      minItems: 1
      maxItems: 30
      items:
        $ref: '#/Option'
Option:
  type: object
  additionalProperties: false
  required: [id, name, price_minor]
  properties:
    variant_prices:
      type: object
      maxProperties: 30
      description: Replacement extra prices keyed by this item's variant IDs. Missing sizes use price_minor; a zero override is valid.
      additionalProperties:
        $ref: '#/Price'
    translations:
      $ref: '#/NameTranslations'
    id:
      $ref: '#/LocalIdentifier'
    name:
      allOf:
        - $ref: ../../../../schemas/common/text.yaml#/PlainText
      type: string
      minLength: 1
      maxLength: 80
    price_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
Price:
  type: integer
  format: int64
  minimum: 0
  maximum: 1000000000
LocalIdentifier:
  type: string
  minLength: 1
  maxLength: 64
  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'
NameTranslations:
  type: object
  additionalProperties: false
  description: Optional display names in supported app languages. Omitted languages fall back to name. Stable identifiers and prices are language independent.
  properties:
    de:
      $ref: '#/TranslatedName'
    en:
      $ref: '#/TranslatedName'
    ar:
      $ref: '#/TranslatedName'
TranslatedName:
  allOf:
    - $ref: ../../../../schemas/common/text.yaml#/PlainText
  type: string
  minLength: 1
  maxLength: 160
  pattern: '\S'
