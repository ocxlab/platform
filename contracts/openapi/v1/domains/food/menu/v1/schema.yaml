FoodMenu:
  type: object
  additionalProperties: false
  required: [currency, availability_mode, items]
  properties:
    currency:
      type: string
      enum: [EUR]
      description: Deliberately limited initial calculation currency, not a core restriction.
    availability_mode:
      type: string
      enum: [manual]
    categories:
      type: array
      maxItems: 50
      description: Ordered menu sections. Items without a category remain visible in a separate section.
      items:
        $ref: '#/Category'
    items:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: '#/Item'
Item:
  type: object
  additionalProperties: false
  required: [id, name, available, variants, option_groups]
  properties:
    category_id:
      $ref: '#/LocalIdentifier'
    image_id:
      type: string
      format: uuid
      description: Ready media owned by this store; never a storage URL. Optional draft-contract addition.
    id:
      $ref: '#/LocalIdentifier'
    name:
      type: string
      minLength: 1
      maxLength: 160
    available:
      type: boolean
      description: Merchant-controlled availability; no quantity reservation.
    variants:
      type: array
      minItems: 1
      maxItems: 30
      items:
        $ref: '#/Variant'
    option_groups:
      type: array
      maxItems: 20
      items:
        $ref: '#/OptionGroup'
Category:
  type: object
  additionalProperties: false
  required: [id, name]
  properties:
    id:
      $ref: '#/LocalIdentifier'
    name:
      type: string
      minLength: 1
      maxLength: 80
Variant:
  type: object
  additionalProperties: false
  required: [id, name, price_minor]
  properties:
    id:
      $ref: '#/LocalIdentifier'
    name:
      type: string
      minLength: 1
      maxLength: 80
    price_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
OptionGroup:
  type: object
  additionalProperties: false
  required: [id, name, min_selected, max_selected, options]
  properties:
    id:
      $ref: '#/LocalIdentifier'
    name:
      type: string
      minLength: 1
      maxLength: 80
    min_selected:
      type: integer
      minimum: 0
      maximum: 30
    max_selected:
      type: integer
      minimum: 1
      maximum: 30
    options:
      type: array
      minItems: 1
      maxItems: 30
      items:
        $ref: '#/Option'
Option:
  type: object
  additionalProperties: false
  required: [id, name, price_minor]
  properties:
    id:
      $ref: '#/LocalIdentifier'
    name:
      type: string
      minLength: 1
      maxLength: 80
    price_minor:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
LocalIdentifier:
  type: string
  minLength: 1
  maxLength: 64
  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'
