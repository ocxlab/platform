Selection:
  type: object
  additionalProperties: false
  required: [line_items]
  properties:
    line_items:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [item, quantity]
        properties:
          id: {type: string, maxLength: 80}
          item:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: {type: string, minLength: 1, maxLength: 80}
          quantity: {type: integer, format: int64, minimum: 1, maximum: 100}
    buyer:
      type: object
      additionalProperties: false
      properties:
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        email: {type: string, maxLength: 254}
Session:
  allOf:
    - {$ref: '../components/common.yaml#/Base'}
    - type: object
      required: [line_items]
      properties:
        line_items:
          type: array
          items:
            type: object
            required: [id, item, quantity, totals]
            properties:
              id: {type: string}
              item:
                type: object
                required: [id, title, price]
                properties:
                  id: {type: string}
                  title: {type: string}
                  price: {type: integer, format: int64, minimum: 0}
              quantity: {type: integer, format: int64, minimum: 1}
              totals: {$ref: '../components/common.yaml#/Totals'}
        buyer: {$ref: '#/Selection/properties/buyer'}
        order:
          type: object
          required: [id, permalink_url]
          properties:
            id: {$ref: '../components/common.yaml#/Id'}
            permalink_url: {type: string, format: uri}
Catalog:
  type: object
  additionalProperties: false
  required: [currency, payment_condition, products]
  properties:
    currency: {type: string, enum: [EUR]}
    payment_condition: {type: string, enum: [pay_later]}
    products:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [id, title, variants]
        properties:
          id: {type: string, minLength: 1, maxLength: 80}
          title: {type: string, minLength: 1, maxLength: 200}
          variants:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: object
              additionalProperties: false
              required: [id, title, price_minor, stock]
              properties:
                id: {type: string, minLength: 1, maxLength: 80}
                title: {type: string, minLength: 1, maxLength: 200}
                price_minor: {type: integer, format: int64, minimum: 0, maximum: 100000000}
                stock: {type: integer, format: int64, minimum: 0, maximum: 1000000}
CatalogWrite:
  type: object
  additionalProperties: false
  required: [base_revision, document]
  properties:
    base_revision: {type: integer, format: int64, minimum: 0}
    document: {$ref: '#/Catalog'}
CatalogResult:
  type: object
  required: [revision, document]
  properties:
    revision: {type: integer, format: int64, minimum: 1}
    document: {$ref: '#/Catalog'}
