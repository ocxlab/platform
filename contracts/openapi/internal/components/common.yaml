Id:
  type: string
  format: uuid
Entity:
  type: object
  required: [version]
  properties:
    id: {type: string}
    version: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    schema: {type: string, format: uri}
    spec: {type: string, format: uri}
    transport: {type: string, enum: [rest]}
    endpoint: {type: string, format: uri}
Registry:
  type: object
  additionalProperties:
    type: array
    items: {$ref: '#/Entity'}
Metadata:
  type: object
  required: [version, capabilities, payment_handlers]
  properties:
    version: {type: string, enum: ['2026-08-25']}
    capabilities: {$ref: '#/Registry'}
    payment_handlers: {$ref: '#/Registry'}
Total:
  type: object
  required: [type, amount]
  properties:
    type: {type: string}
    amount: {type: integer, format: int64, minimum: 0, maximum: 100000000}
Totals:
  type: array
  minItems: 2
  maxItems: 2
  items: {$ref: '#/Total'}
Message:
  type: object
  required: [type, code, content, severity]
  properties:
    type: {type: string, enum: [error]}
    code: {type: string}
    content: {type: string}
    severity: {type: string, enum: [recoverable, unrecoverable]}
Base:
  type: object
  required: [ucp, id, status, currency, totals, links, expires_at]
  properties:
    ucp: {$ref: '#/Metadata'}
    id: {$ref: '#/Id'}
    status: {type: string, enum: [incomplete, ready_for_complete, completed, canceled]}
    currency: {type: string, enum: [EUR]}
    totals: {$ref: '#/Totals'}
    links:
      type: array
      items:
        type: object
        required: [type, url]
        properties:
          type: {type: string}
          url: {type: string, format: uri}
    messages:
      type: array
      items: {$ref: '#/Message'}
    expires_at: {type: string, format: date-time}
Complete:
  type: object
  additionalProperties: false
  required: [payment]
  properties:
    payment:
      type: object
      additionalProperties: false
      required: [instruments]
      properties:
        instruments:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, handler_id, type]
            properties:
              id: {type: string, enum: [pay-later]}
              handler_id: {type: string, enum: [ocp-pay-later]}
              type: {type: string, enum: [pay_later]}
Empty:
  type: object
  additionalProperties: false
Error:
  type: object
  required: [ucp, messages]
  additionalProperties: false
  properties:
    ucp:
      type: object
      required: [version, status]
      properties:
        version: {type: string, enum: ['2026-08-25']}
        status: {type: string, enum: [error]}
    messages:
      type: array
      minItems: 1
      items: {$ref: '#/Message'}
Profile:
  type: object
  required: [ucp]
  properties:
    ucp:
      type: object
      required: [version, services, capabilities, payment_handlers]
      properties:
        version: {type: string, enum: ['2026-08-25']}
        services: {$ref: '#/Registry'}
        capabilities: {$ref: '#/Registry'}
        payment_handlers: {$ref: '#/Registry'}
