version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/core/persistence/queries
    gen:
      go: &go
        package: sqlgen
        out: internal/core/persistence/sqlgen
        sql_package: database/sql
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: true
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/food/persistence/queries
    gen:
      go:
        <<: *go
        out: internal/food/persistence/sqlgen
